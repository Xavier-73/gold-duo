name: gold-watch

# 全免费盯盘：每5分钟跑一次 scripts/gold_watch.py
# 默认4档：965清仓 / 961走一半 / 935止损 / 955走弱提醒
# 规则：穿越触发＋15分钟防抖（FLAP_MIN），回到线内再穿出来才算新事件
# 自定义：在 Variables 里加 LEVELS，格式“价格:方向:文案”用英文分号隔开
# 例：965:high:到965全走;961:high:到961卖25g;935:low:破935走25g
# 需要先在 GitHub 仓库 Settings → Secrets → Actions 里加 BARK_KEY
# （iPhone 装 Bark App，打开就显示 key；自建 server 才需要改 BARK_URL）

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑不推送（填 1 则只打印）"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run gold watch
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_URL: ${{ vars.BARK_URL }}
          TH_HIGH: ${{ vars.TH_HIGH }}
          TH_LOW: ${{ vars.TH_LOW }}
          LEVELS: ${{ vars.LEVELS }}
          COOLDOWN_MIN: ${{ vars.COOLDOWN_MIN }}
          FLAP_MIN: ${{ vars.FLAP_MIN }}
          BANK_OFFSET: ${{ vars.BANK_OFFSET }}
          FACTOR: ${{ vars.FACTOR }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          : "${BARK_URL:=https://api.day.app}"
          : "${COOLDOWN_MIN:=15}"
          : "${BANK_OFFSET:=0}"
          : "${FACTOR:=1}"
          export BARK_URL COOLDOWN_MIN BANK_OFFSET FACTOR LEVELS
          if [ -n "${FLAP_MIN:-}" ]; then export FLAP_MIN; fi
          # 注意：TH_HIGH/TH_LOW 故意不设默认值，不填就用脚本内置4档；
          # 一旦填了任一个，就退回老式两档模式
          if [ -n "${TH_HIGH:-}" ]; then export TH_HIGH; else unset TH_HIGH; fi
          if [ -n "${TH_LOW:-}" ]; then export TH_LOW; else unset TH_LOW; fi
          python3 scripts/gold_watch.py

      - name: Commit push state (only if changed)
        run: |
          if git status --porcelain gold-push-state.json | grep -q .; then
            git config user.name "gold-watch-bot"
            git config user.email "gold-watch-bot@users.noreply.github.com"
            git add gold-push-state.json
            git commit -m "chore: update gold push state [skip ci]"
            git push
          else
            echo "state unchanged, skip commit"
          fi
